[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ganda"
version = "0.1.0"
description = "Multi-model metamorphic fuzzer: one engine-agnostic core, one provider per DBMS"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "rdflib>=7"]
# the SAP HANA provider's driver (`ganda hana ...`)
hana = ["hdbcli>=2.20"]

[project.scripts]
ganda = "ganda.cli:main"

[tool.setuptools.packages.find]
include = ["ganda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
